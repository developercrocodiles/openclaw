name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Android toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: restore

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure throwaway release signing
        run: |
          cat >> apps/android/gradle.properties <<'EOF'
          OPENCLAW_ANDROID_STORE_FILE=/tmp/openclaw-release.keystore
          OPENCLAW_ANDROID_STORE_PASSWORD=openclaw123
          OPENCLAW_ANDROID_KEY_ALIAS=openclaw-release
          OPENCLAW_ANDROID_KEY_PASSWORD=openclaw123
          EOF

      - name: Generate throwaway release keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/openclaw-release.keystore \
            -alias openclaw-release \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass openclaw123 \
            -keypass openclaw123 \
            -dname "CN=OpenClaw Release, O=OpenClaw, C=US"

      - name: Build Production Android APK
        working-directory: apps/android
        run: |
          ./gradlew :app:assemblePlayRelease :wear:assembleRelease \
            -PopenclawBuildCommit=$(git rev-parse HEAD) \
            -PopenclawBuildTimestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
        timeout-minutes: 45

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            apps/android/app/build/outputs/apk/play/release/*.apk
            apps/android/wear/build/outputs/apk/release/*.apk
          retention-days: 7
